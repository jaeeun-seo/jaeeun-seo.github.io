<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google-site-verification" content="ZonMnKLXYg-lrhGrHCYXky19ZHCL-qSzrHe8aLh-3So" />
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ site.title }}</title>

  <!-- No tab icon; this stops browsers from requesting a missing /favicon.ico. -->
  <link rel="icon" href="data:,">

  <!-- Theme before anything renders, so dark-mode visitors never see a white flash.
       Follows the device setting; the switch stores a choice only while it differs
       from the device (same rule in _layouts/booking.html). -->
  <script>
    (function () {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var device = function () { return mq.matches ? 'dark' : 'light'; };
      var saved = function () { try { return localStorage.getItem('theme'); } catch (e) { return null; } };
      var store = function (t) {
        try { if (t === device()) localStorage.removeItem('theme'); else localStorage.setItem('theme', t); } catch (e) { /* storage blocked */ }
      };
      var refresh = function () {
        if (saved() === device()) store(device());          // choice now matches the device -> back to automatic
        document.documentElement.dataset.theme = saved() || device();
      };
      window.chooseTheme = function (t) { store(t); refresh(); };
      refresh();
      if (mq.addEventListener) mq.addEventListener('change', refresh); else mq.addListener(refresh);
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Raleway: body. Work Sans: headings and name. Open Sans Light: abstracts. -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Work+Sans:wght@400;700&family=Open+Sans:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

  <!-- Load CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <img src="{{ '/assets/images/profile.png' | relative_url }}" alt="Profile" class="profile-img">
      <h2 class="name">{{ site.title }}</h2>
      <p class="affiliation">{{ site.affiliation }}</p>

      <!-- <div class="social"> -->
	<!-- <a href="https://github.com/username" style="font-size: 1.5rem"><i class="fab fa-github"></i></a> -->
        <!-- <a href="https://www.linkedin.com/in/username" style="font-size: 1.5rem"><i class="fab fa-linkedin"></i></a> -->
        <!-- <a href="https://scholar.google.com/citations?user=XXX" style="font-size: 1.5rem"><i class="fab fa-google"></i></a> -->
      <!-- </div> -->

      <footer class="sidebar-footer">
        <p> © {{ site.time | date: "%Y" }}</p>
      </footer>

      <p class="theme-switch">
        <span class="switch-label">Dark Mode</span>
	<span class="switch-slider" id="theme-switch"></span>
      </p>
    </aside>

    <main class="content">
      {{ content }}
    </main>
  </div>
  <script>
    const slider = document.getElementById('theme-switch');
    const root   = document.documentElement;

    // The theme itself is decided in <head>; the switch only mirrors it.
    const syncSlider = () => slider.classList.toggle('active', root.dataset.theme === 'dark');
    syncSlider();
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', syncSlider); else mq.addListener(syncSlider);

    slider.addEventListener('click', () => {
      chooseTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
      syncSlider();
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.abstract-toggle').forEach(link => {
        link.addEventListener('click', function () {
          const container = this.closest('.WP, .WIP');
          const abstractDiv = container.querySelector('.abstract-content');
          const isOpen = abstractDiv.classList.contains('open');

          // Animate between 0 and the abstract's real height (no fixed cap that cuts long text).
          if (isOpen) {
            abstractDiv.style.maxHeight = abstractDiv.scrollHeight + 'px';   // from 'none' back to a number
            void abstractDiv.offsetHeight;                                   // apply it before collapsing
            abstractDiv.style.maxHeight = '';
          } else {
            abstractDiv.style.maxHeight = abstractDiv.scrollHeight + 'px';
          }
          abstractDiv.classList.toggle('open');
          this.classList.toggle('open');
        });
      });
      // Once fully open, drop the cap so later reflows (window resize, font load) can't cut the text.
      document.querySelectorAll('.abstract-content').forEach(div => {
        div.addEventListener('transitionend', e => {
          if (e.propertyName === 'max-height' && div.classList.contains('open')) div.style.maxHeight = 'none';
        });
      });
    });
  </script>
</body>
</html>
