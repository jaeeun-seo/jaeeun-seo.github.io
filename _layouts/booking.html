<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Booking pages are private: keep them out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>미팅 예약 · {{ site.title }}</title>
  <!-- Tab icon: green in light theme, blue in dark (swapped by the theme script below). -->
  <link rel="icon" type="image/svg+xml" id="bk-icon-svg" href="{{ '/assets/booking/icon-book.svg' | relative_url }}"
        data-light="{{ '/assets/booking/icon-book.svg' | relative_url }}" data-dark="{{ '/assets/booking/icon-book-dark.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" id="bk-icon-png" href="{{ '/assets/booking/icon-book-32.png' | relative_url }}"
        data-light="{{ '/assets/booking/icon-book-32.png' | relative_url }}" data-dark="{{ '/assets/booking/icon-book-dark-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/booking/icon-book.png' | relative_url }}">
  <script>
    // Theme first (no flash), then start the API request right away, before any CSS loads.
    (function () {
      // Same theme rule as the homepage (_layouts/default.html): device setting, unless
      // the homepage switch stored a different choice; follows device changes live.
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var device = function () { return mq.matches ? 'dark' : 'light'; };
      var saved = function () { try { return localStorage.getItem('theme'); } catch (e) { return null; } };
      var refresh = function () {
        if (saved() === device()) { try { localStorage.removeItem('theme'); } catch (e) { /* storage blocked */ } }
        var theme = saved() || device();
        document.documentElement.dataset.theme = theme;
        ['bk-icon-svg', 'bk-icon-png'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.href = el.getAttribute('data-' + theme);
        });
      };
      refresh();
      if (mq.addEventListener) mq.addEventListener('change', refresh); else mq.addListener(refresh);

      var api = window.BOOKING_API = {{ site.data.booking.api | jsonify }};
      var q = new URLSearchParams(location.search), url = null;
      if (q.get('t')) url = api + '?action=booking&t=' + encodeURIComponent(q.get('t'));
      else if (q.get('m')) url = api + '?action=init&m=' + encodeURIComponent(q.get('m'));
      if (url && window.fetch) {
        window.BK_BOOT = fetch(url).then(function (r) { return r.text(); }, function () { return null; });
      }
    })();
  </script>

  <!-- The booking API lives on Google Apps Script: open those connections early. -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,600,700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/booking/booking.css' | relative_url }}">
</head>
<body>
  <main class="bk-page">
    {{ content }}
  </main>
</body>
</html>
